<html lang="ko">
<head>

<script src="runtime-config.js"></script>
<style>
:root{--bg:#eceff2;--paper:#fff;--ink:#10151b;--muted:#68727d;--line:#d7dde2;--nav:#080c11;--nav2:#111820;--blue:#b58a36;--blue-soft:#f5efe3;--up:#c33128;--down:#1767b5;--shadow:0 18px 48px rgba(10,18,27,.1);--sans:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;color:var(--ink);font:16px/1.55 var(--sans);font-feature-settings:"tnum" 1,"kern" 1;background:var(--bg)}button,a{font:inherit}button{cursor:pointer}
.appbar{position:sticky;top:0;z-index:20;background:rgba(8,12,17,.98);color:#fff;border-top:2px solid #b58a36;border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px)}
.appbar-in{max-width:1180px;height:68px;margin:auto;padding:0 28px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:11px;border:0;background:none;color:#fff;padding:0;font-weight:800;letter-spacing:.04em}.brandmark{width:30px;height:30px;border:1px solid #b58a36;display:grid;place-items:center;color:#d6b66f;font:700 12px Georgia,serif}
.global-nav{display:flex;gap:4px}.global-nav button{border:0;color:#9fabb9;background:transparent;padding:10px 14px;border-radius:8px;font-weight:700;font-size:14px}.global-nav button.on{color:#fff;background:#1a2430}.status{margin-left:auto;display:flex;align-items:center;gap:9px;color:#9fabb9;font-size:12px;white-space:nowrap}.status i{width:7px;height:7px;border-radius:50%;background:#e7a329;box-shadow:0 0 0 4px rgba(231,163,41,.12)}.status.live i{background:#58c993;box-shadow:0 0 0 4px rgba(88,201,147,.12)}.status.error i{background:#d8665f;box-shadow:0 0 0 4px rgba(216,102,95,.12)}
.shell{max-width:1180px;margin:0 auto;padding:34px 28px 80px}.loading{min-height:55vh;display:grid;place-items:center;color:var(--muted)}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1,h2,h3,p{margin-top:0}h1{font-size:38px;line-height:1.16;font-weight:850;letter-spacing:-.05em;margin:8px 0 10px}h2{font-size:23px;letter-spacing:-.03em;margin:0}h3{font-size:17px;letter-spacing:-.02em;margin:0}.lede{color:var(--muted);margin:0;max-width:680px}
.home-head,.account-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:24px}.account-head{align-items:flex-start}.asof{text-align:right;color:var(--muted);font-size:13px}.asof b{display:block;color:var(--ink);font-size:14px}
.overview{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.65fr);background:var(--nav);color:#fff;border-top:3px solid #b58a36;border-radius:1px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}.overview-main{padding:28px 30px}.overview-side{padding:26px;border-left:1px solid rgba(255,255,255,.12);background:var(--nav2);display:grid;align-content:center;gap:15px}.overview-label{font-size:13px;color:#aeb8c5}.overview-value{font-size:46px;line-height:1.12;font-weight:800;letter-spacing:-.05em;margin-top:5px;font-variant-numeric:tabular-nums}.overview-value.up{color:#ff8c81}.overview-value.down{color:#75b5ff}.overview-note{color:#aeb8c5;font-size:13px;margin-top:11px}.mini-stat{display:flex;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:11px}.mini-stat:last-child{border-bottom:0;padding-bottom:0}.mini-stat span{color:#9eabb8;font-size:13px}.mini-stat b{font-variant-numeric:tabular-nums}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:32px 0 12px}.section-head p{margin:0;color:var(--muted);font-size:13px}.accounts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.account-card{position:relative;text-align:left;background:var(--paper);border:1px solid var(--line);border-top:2px solid #202a34;padding:22px;border-radius:1px;min-height:190px;box-shadow:0 6px 22px rgba(15,25,35,.035);transition:.18s ease}.account-card:hover{transform:translateY(-2px);border-color:#b58a36;box-shadow:var(--shadow)}.account-card .market{color:var(--muted);font-size:13px;font-weight:700}.account-card .title{font-size:21px;font-weight:800;margin-top:5px;letter-spacing:-.03em}.account-card .return{font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:18px;font-variant-numeric:tabular-nums}.account-card .meta{display:flex;gap:14px;color:var(--muted);font-size:13px;margin-top:9px}.account-card.pending{background:#f7f8f9;border-top-color:#929ba4}.account-card.pending .return{font-size:17px;color:var(--muted)}
.up{color:var(--up)!important}.down{color:var(--down)!important}.neutral{color:var(--muted)!important}.focus-list{background:var(--paper);border:1px solid var(--line);border-top:2px solid #202a34;box-shadow:0 7px 24px rgba(15,25,35,.035)}.focus-row{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(3,minmax(92px,.65fr));align-items:center;gap:14px;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:15px 18px;text-align:left;transition:.15s ease}.focus-row:last-child{border-bottom:0}.focus-row:hover,.rowbtn:hover{background:#fbfaf7;box-shadow:inset 3px 0 var(--blue)}.stock-name{font-weight:800;letter-spacing:-.02em}.stock-sub{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}.cell-label{display:none}.cell{font-size:14px;font-variant-numeric:tabular-nums}.cell strong{font-size:16px}.empty{padding:28px;color:var(--muted);text-align:center;background:#fff;border:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:20px}.crumb button{border:0;background:none;color:var(--muted);padding:0}.crumb button:hover{color:var(--blue)}.back{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;font-weight:700;font-size:13px}
.summary-strip{display:grid;grid-template-columns:1.3fr repeat(4,1fr);border:1px solid var(--line);border-top:2px solid #202a34;background:var(--paper);margin:18px 0 16px;box-shadow:0 7px 24px rgba(15,25,35,.035)}.summary-cell{padding:18px;border-right:1px solid var(--line)}.summary-cell:last-child{border-right:0}.summary-cell span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.summary-cell b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.summary-cell.primary{background:#faf9f6}.summary-cell.primary b{font-size:25px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-top:28px}.tab{border:0;background:transparent;color:var(--muted);font-weight:800;padding:13px 18px;border-bottom:3px solid transparent;margin-bottom:-1px;transition:.15s ease}.tab:hover{color:var(--ink);background:rgba(181,138,54,.05)}.tab.on{color:var(--ink);border-bottom-color:var(--blue)}.panel{margin-top:14px}.panel-note{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:12px 15px;border-left:3px solid var(--blue);background:var(--blue-soft);color:#4e4638;font-size:13px;margin-bottom:12px}.panel-note b{color:#7e5a18}
.table-head,.rowbtn{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(4,minmax(100px,.7fr));gap:14px}.table-head{padding:10px 18px;color:var(--muted);font-size:12px;font-weight:700}.rowbtn{align-items:center;width:100%;padding:16px 18px;border:1px solid var(--line);border-bottom:0;background:#fff;text-align:left;transition:.15s ease}.rowbtn:last-child{border-bottom:1px solid var(--line)}.risk{height:5px;background:#edf0f3;margin-top:6px;overflow:hidden}.risk i{display:block;height:100%;background:var(--blue)}
.performance-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat-card{background:#fff;border:1px solid var(--line);border-top:2px solid #202a34;padding:18px;box-shadow:0 5px 18px rgba(15,25,35,.025)}.stat-card span{display:block;color:var(--muted);font-size:12px}.stat-card b{display:block;font-size:23px;margin-top:6px;font-variant-numeric:tabular-nums}.history-box{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}.history-box summary{cursor:pointer;font-weight:800;color:var(--muted)}.history-content{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}
.stock-hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:14px;margin-bottom:14px}.quote-card,.decision-card,.detail-card{background:#fff;border:1px solid var(--line);padding:24px;box-shadow:0 7px 24px rgba(15,25,35,.035)}.quote-card,.detail-card{border-top:2px solid #202a34}.quote-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.quote-name{font-size:30px;font-weight:800;letter-spacing:-.045em}.quote-code{color:var(--muted);font-size:13px;margin-top:3px}.quote-return{font-size:35px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-align:right}.quote-price{text-align:right;color:var(--muted);font-size:13px}
.decision-card{background:var(--nav);color:#fff;border-color:var(--nav);border-top:3px solid var(--blue)}.decision-label{color:#cbb47d;font-size:12px;font-weight:800;letter-spacing:.08em}.decision-title{font-size:24px;font-weight:800;margin-top:8px;letter-spacing:-.035em}.decision-copy{color:#b5c0cc;font-size:14px;margin-top:9px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.level{border-top:1px solid rgba(255,255,255,.18);padding-top:10px}.level span{display:block;color:#8f9cac;font-size:11px}.level b{font-size:15px;font-variant-numeric:tabular-nums}.detail-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.detail-card h3{margin-bottom:16px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.fact{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.fact span{color:var(--muted)}.fact b{font-variant-numeric:tabular-nums;text-align:right}.chart{width:100%;height:180px;background:#faf9f6;border:1px solid var(--line);display:block}.chart-legend{display:flex;gap:15px;color:var(--muted);font-size:12px;margin-top:8px}.chart-legend i{display:inline-block;width:16px;height:2px;vertical-align:middle;margin-right:5px}.source-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.notice{margin-top:34px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px}.legacy-link{color:var(--muted);font-size:12px;text-decoration:none}.legacy-link:hover{color:var(--blue)}
button:focus-visible,a:focus-visible{outline:3px solid rgba(181,138,54,.28);outline-offset:2px}
@media(max-width:860px){.shell{padding:26px 18px 70px}.appbar-in{padding:0 18px}.status{display:none}.overview{grid-template-columns:1fr}.overview-side{border-left:0;border-top:1px solid rgba(255,255,255,.12);grid-template-columns:repeat(3,1fr)}.accounts{grid-template-columns:1fr 1fr}.summary-strip{grid-template-columns:1fr 1fr}.summary-cell{border-bottom:1px solid var(--line)}.summary-cell:nth-child(2n){border-right:0}.summary-cell:last-child{border-bottom:0}.stock-hero,.detail-grid{grid-template-columns:1fr}.performance-grid,.history-content{grid-template-columns:1fr 1fr}}
@media(max-width:620px){body{font-size:15px}.appbar-in{height:60px;gap:12px}.brand span:last-child{display:none}.global-nav{margin-left:auto}.global-nav button{padding:9px 10px}.shell{padding:22px 14px 62px}.home-head,.account-head{align-items:flex-start;flex-direction:column}.asof{text-align:left}h1{font-size:29px}.overview-main{padding:22px}.overview-value{font-size:37px}.overview-side{padding:18px;grid-template-columns:1fr}.accounts{grid-template-columns:1fr}.account-card:last-child{grid-column:auto}.focus-row,.rowbtn{grid-template-columns:1fr;padding:15px}.focus-row .cell,.rowbtn .cell{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}.cell-label{display:inline;color:var(--muted)}.table-head{display:none}.summary-strip{grid-template-columns:1fr 1fr}.summary-cell{padding:14px}.summary-cell.primary{grid-column:1/-1;border-right:0}.tabs{overflow:auto}.tab{white-space:nowrap;padding:12px 14px}.panel-note{align-items:flex-start;flex-direction:column}.performance-grid,.history-content{grid-template-columns:1fr 1fr}.quote-top{align-items:flex-start;flex-direction:column}.quote-return,.quote-price{text-align:left}.levels{grid-template-columns:1fr}.facts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <button class="brand" onclick="go('/')"><span class="brandmark">TM</span><span>TRADING MASTER</span></button>
  <nav class="global-nav" aria-label="주요 메뉴"><button id="nav-home" onclick="go('/')">계좌</button><button id="nav-performance" onclick="go('/performance')">성과</button></nav>
  <div class="status"><i></i><span id="header-status">스냅샷 확인 중</span></div>
</div></header>
<main id="app" class="shell"><div class="loading">운용 기록을 불러오는 중입니다.</div></main>
<script>
const ACCOUNT_META={ks_mid:{name:'코스피',market:'KOSPI',desc:'대형주·중형주 중심 운용 계좌'},kq_mid:{name:'코스닥',market:'KOSDAQ',desc:'성장주 중심 운용 계좌'}};
let DATA=null,REFERENCE_QUOTES={},LOAD_ERROR=null,DATA_MODE='loading',refreshTimer=null;const app=document.getElementById('app');
const won=n=>Math.round(Number(n||0)).toLocaleString('ko-KR')+'원',num=n=>Math.round(Number(n||0)).toLocaleString('ko-KR'),pct=n=>(Number(n||0)>=0?'+':'')+Number(n||0).toFixed(2)+'%',tone=n=>Number(n||0)>0?'up':Number(n||0)<0?'down':'neutral';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(path){location.hash='#'+path}function parseRoute(){const raw=(location.hash.slice(1)||'/').split('?');return{parts:raw[0].split('/').filter(Boolean),query:new URLSearchParams(raw[1]||'')}}
function account(id){return DATA?.accounts?.[id]||null}function forward(id){return account(id)?.forward||null}function fmtDate(v){return v?String(v).slice(0,10).replaceAll('-','. '):'—'}
function breadcrumb(items){return'<div class="crumb">'+items.map((x,i)=>i===items.length-1?'<span>'+esc(x.label)+'</span>':'<button onclick="go(\''+x.path+'\')">'+esc(x.label)+'</button><span>/</span>').join('')+'</div>'}
function accountCard(id){const a=account(id),s=a?.forward?.summary||{},m=ACCOUNT_META[id],idle=!s.open_count&&!s.closed_count;return'<button class="account-card '+(idle?'pending':'')+'" onclick="go(\'/account/'+id+'\')"><div class="market">'+m.market+'</div><div class="title">'+m.name+'</div>'+(idle?'<div class="return">데이터 대기</div>':'<div class="return '+tone(s.return_on_seed_pct)+'">'+pct(s.return_on_seed_pct)+'</div>')+'<div class="meta"><span>보유 '+(s.open_count||0)+'</span><span>청산 '+(s.closed_count||0)+'</span></div></button>'}
function stockRow(o,id,compact=false){const gap=o.current?((o.current-o.stop)/o.current*100):0;return'<button class="'+(compact?'focus-row':'rowbtn')+'" onclick="go(\'/account/'+id+'/stock/'+o.code+'\')"><div><span class="stock-name">'+esc(o.name)+'</span><span class="stock-sub">'+esc(o.code)+' · '+fmtDate(o.entry_date)+' 편입 · '+(o.days||0)+'일</span></div><div class="cell"><span class="cell-label">현재가</span><strong>'+num(o.current)+'</strong></div><div class="cell"><span class="cell-label">수익률</span><strong class="'+tone(o.pnl_pct)+'">'+pct(o.pnl_pct)+'</strong></div><div class="cell"><span class="cell-label">'+(compact?'보호선':'평가손익')+'</span><span>'+(compact?num(o.stop):won((o.current-o.entry_price)*o.shares))+'</span></div>'+(compact?'':'<div class="cell"><span class="cell-label">보호 여유</span><span>'+Math.max(0,gap).toFixed(1)+'%</span><div class="risk"><i style="width:'+Math.min(100,Math.max(4,gap*2))+'%"></i></div></div>')+'</button>'}
function footer(){return'<footer class="notice">모의운용 기록이며 실제 투자성과가 아닙니다. 표시 가격은 스냅샷 생성 시점과 현재 시세가 다를 수 있습니다.</footer>'}
function renderHome(){const c=DATA.combined_forward||{},ids=['ks_mid','kq_mid'],open=ids.flatMap(id=>(forward(id)?.open||[]).map(o=>({...o,_account:id}))).sort((a,b)=>Math.abs(b.pnl_pct)-Math.abs(a.pnl_pct));
app.innerHTML='<div class="home-head"><div><div class="eyebrow">Portfolio desk</div><h1>운용 계좌</h1><p class="lede">현재 보유, 청산 기록과 계좌별 포워드 성과.</p></div><div class="asof"><b>'+fmtDate(DATA.meta.forward_start_date)+' 이후</b>포워드 모의운용</div></div>'
+'<section class="overview"><div class="overview-main"><div class="overview-label">통합 포워드 손익</div><div class="overview-value '+tone(c.net_pnl_won)+'">'+(c.net_pnl_won>=0?'+':'')+won(c.net_pnl_won)+'</div><div class="overview-note">기준금 '+won(c.seed)+' · 과거 백테스트와 합산하지 않음</div></div><div class="overview-side"><div class="mini-stat"><span>수익률</span><b class="'+tone(c.return_on_seed_pct)+'">'+pct(c.return_on_seed_pct)+'</b></div><div class="mini-stat"><span>실현손익</span><b class="'+tone(c.realized_won)+'">'+won(c.realized_won)+'</b></div><div class="mini-stat"><span>평가손익</span><b class="'+tone(c.unrealized_won)+'">'+won(c.unrealized_won)+'</b></div></div></section>'
+'<div class="section-head"><div><div class="eyebrow">Accounts</div><h2>계좌 선택</h2></div></div><section class="accounts">'+ids.map(accountCard).join('')+'</section>'
+'<div class="section-head"><div><div class="eyebrow">Movement</div><h2>변동이 큰 보유 종목</h2></div><p>현재 스냅샷 기준</p></div>'+(open.length?'<section class="focus-list">'+open.slice(0,6).map(o=>stockRow(o,o._account,true)).join('')+'</section>':'<div class="empty">현재 보유 종목이 없습니다.</div>')+footer()}
function accountSummary(id){const s=forward(id).summary;return'<section class="summary-strip"><div class="summary-cell primary"><span>계좌 손익</span><b class="'+tone(s.net_pnl_won)+'">'+(s.net_pnl_won>=0?'+':'')+won(s.net_pnl_won)+'</b></div><div class="summary-cell"><span>수익률</span><b class="'+tone(s.return_on_seed_pct)+'">'+pct(s.return_on_seed_pct)+'</b></div><div class="summary-cell"><span>실현손익</span><b class="'+tone(s.realized_won)+'">'+won(s.realized_won)+'</b></div><div class="summary-cell"><span>평가손익</span><b class="'+tone(s.unrealized_won)+'">'+won(s.unrealized_won)+'</b></div><div class="summary-cell"><span>보유 / 청산</span><b>'+s.open_count+' / '+s.closed_count+'</b></div></section>'}
function accountTabs(id,tab){return'<div class="tabs">'+[['hold','보유'],['closed','청산'],['performance','성과']].map(x=>'<button class="tab '+(tab===x[0]?'on':'')+'" onclick="go(\'/account/'+id+'?tab='+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>'}
function historicalPerformance(a){const h=a.historical||{},s=h.summary;if(!s||h.coverage?.complete!==true)return '<div class="empty">과거 전체 기록이 확인되지 않아 성과 집계를 표시하지 않습니다.</div>';const ratio=s.profit_loss_ratio==null?'산출 불가':Number(s.profit_loss_ratio).toLocaleString('ko-KR',{maximumFractionDigits:2}),reason={no_closed_trades:'청산 기록 없음',no_winning_trades:'이익 거래 없음',no_losing_trades:'손실 거래 없음',no_loss_amount:'평균 손실이 0'}[s.profit_loss_ratio_status];return '<div class="history-content"><div class="stat-card"><span>청산 거래</span><b>'+s.closed_count+'건</b></div><div class="stat-card"><span>승률</span><b>'+s.win_rate+'%</b></div><div class="stat-card"><span>손익비</span><b>'+ratio+'</b>'+(reason?'<span>'+reason+'</span>':'')+'</div><div class="stat-card"><span>실현손익</span><b class="'+tone(s.realized_won)+'">'+won(s.realized_won)+'</b></div></div><p class="source-note">'+fmtDate(a.forward.start_date)+' 이전 청산 기록 · 포워드 성과와 별도 집계</p>'}
function renderAccount(id,tab){const a=account(id),m=ACCOUNT_META[id];if(!a||!m){go('/');return}const f=a.forward,s=f.summary,open=f.open||[],closed=f.closed||[];let body='';
if(tab==='closed'){body=closed.length?'<div class="table-head"><span>종목</span><span>진입가</span><span>청산가</span><span>실현손익</span><span>수익률</span></div>'+closed.map(o=>'<div class="rowbtn" style="cursor:default"><div><span class="stock-name">'+esc(o.name)+'</span><span class="stock-sub">'+fmtDate(o.entry_date)+' – '+fmtDate(o.exit_date)+' · '+esc(o.reason||'')+'</span></div><div class="cell"><span class="cell-label">진입가</span><strong>'+num(o.entry_price)+'</strong></div><div class="cell"><span class="cell-label">청산가</span><strong>'+num(o.exit_price)+'</strong></div><div class="cell"><span class="cell-label">실현손익</span><strong class="'+tone(o.pnl_won)+'">'+won(o.pnl_won)+'</strong></div><div class="cell"><span class="cell-label">수익률</span><strong class="'+tone(o.pnl_pct)+'">'+pct(o.pnl_pct)+'</strong></div></div>').join(''):'<div class="empty">포워드 기간에 청산된 거래가 없습니다.</div>'}
else if(tab==='performance'){body='<div class="panel-note"><span><b>포워드 성과</b>만 기본 표시합니다.</span><span>실제 자금이 아닌 모의운용 기록</span></div><div class="performance-grid"><div class="stat-card"><span>청산 거래</span><b>'+s.closed_count+'건</b></div><div class="stat-card"><span>승률</span><b>'+s.win_rate+'%</b></div><div class="stat-card"><span>평균 수익</span><b class="up">'+pct(s.avg_win_pct)+'</b></div><div class="stat-card"><span>평균 손실</span><b class="down">'+Number(s.avg_loss_pct||0).toFixed(2)+'%</b></div></div><details class="history-box"><summary>과거 백테스트 별도 보기</summary>'+historicalPerformance(a)+'</details>'}
else{body=open.length?'<div class="table-head"><span>종목</span><span>현재가</span><span>수익률</span><span>평가손익</span><span>보호 여유</span></div>'+open.map(o=>stockRow(o,id)).join(''):'<div class="empty">현재 보유 종목이 없습니다.</div>'}
app.innerHTML=breadcrumb([{label:'계좌',path:'/'},{label:m.name}])+'<div class="account-head"><div><div class="eyebrow">'+m.market+'</div><h1>'+m.name+'</h1><p class="lede">'+m.desc+' · '+fmtDate(f.start_date)+' 이후 포워드 기록</p></div><button class="back" onclick="go(\'/\')">계좌 전체</button></div>'+accountSummary(id)+accountTabs(id,tab)+'<section class="panel">'+body+'</section>'+footer()}
function chartSvg(hist,entry,stop){const arr=(hist||[]).filter(x=>Number.isFinite(+x.p)).slice(-80);if(arr.length<2)return'<div class="empty">가격 기록이 더 쌓이면 추이를 표시합니다.</div>';const vals=arr.flatMap(x=>[+x.p,+x.s]).concat([+entry,+stop]).filter(Number.isFinite),lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1,W=700,H=180,p=12;const path=key=>arr.map((x,i)=>{const px=p+i/(arr.length-1)*(W-p*2),py=p+(H-p*2)-((+x[key]-lo)/span)*(H-p*2);return(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}).join(' ');return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+path('p')+'" fill="none" stroke="#b58a36" stroke-width="3"/><path d="'+path('s')+'" fill="none" stroke="#c33128" stroke-width="2"/></svg><div class="chart-legend"><span><i style="background:#b58a36"></i>가격</span><span><i style="background:#c33128"></i>보호선</span></div>'}
function findStock(id,code){const f=forward(id);return(f?.open||[]).find(x=>String(x.code)===String(code))||(f?.closed||[]).find(x=>String(x.code)===String(code))}
function renderStock(id,code){const o=findStock(id,code),m=ACCOUNT_META[id];if(!o||!m){go('/account/'+id);return}const isOpen=o.current!=null,price=isOpen?o.current:o.exit_price,pnl=o.pnl_pct||0,stop=o.stop||o.floor||0,above=isOpen&&price>=stop,protected=stop>o.entry_price;const decision=!isOpen?'청산 완료':above?(protected?'수익 보호 구간':'보유 기준 유지'):'보호선 이탈';const copy=!isOpen?esc(o.reason||'운용 규칙에 따라 청산되었습니다.'):above?(protected?'보호선이 진입가 위에 있어 수익을 지키는 단계입니다.':'현재가는 보호선 이상입니다. 보호선 이탈 전까지 보유 기준이 유지됩니다.'):'현재가가 보호선 아래입니다. 다음 갱신에서 청산 조건 확인이 필요합니다.';
app.innerHTML=breadcrumb([{label:'계좌',path:'/'},{label:m.name,path:'/account/'+id},{label:o.name}])+'<div class="stock-hero"><section class="quote-card"><div class="quote-top"><div><div class="eyebrow">'+m.market+'</div><div class="quote-name">'+esc(o.name)+'</div><div class="quote-code">'+esc(o.code)+' · '+(isOpen?'보유 중':'청산')+'</div></div><div><div class="quote-return '+tone(pnl)+'">'+pct(pnl)+'</div><div class="quote-price">'+num(price)+'원</div></div></div></section><section class="decision-card"><div class="decision-label">CURRENT STATUS</div><div class="decision-title">'+decision+'</div><div class="decision-copy">'+copy+'</div><div class="levels"><div class="level"><span>진입가</span><b>'+num(o.entry_price)+'</b></div><div class="level"><span>'+(isOpen?'현재가':'청산가')+'</span><b>'+num(price)+'</b></div><div class="level"><span>보호선</span><b>'+(stop?num(stop):'—')+'</b></div></div></section></div><div class="detail-grid"><section class="detail-card"><h3>가격과 보호선</h3>'+chartSvg(o.hist,o.entry_price,stop)+'<p class="source-note">선은 원본 엔진이 기록한 값입니다. 계산식은 이번 화면 개편에서 변경하지 않았습니다.</p></section><section class="detail-card"><h3>운용 기록</h3><div class="facts"><div class="fact"><span>편입일</span><b>'+fmtDate(o.entry_date)+'</b></div><div class="fact"><span>보유기간</span><b>'+(o.days||0)+'일</b></div><div class="fact"><span>수량</span><b>'+num(o.shares)+'주</b></div><div class="fact"><span>평가금액</span><b>'+won((price||0)*(o.shares||0))+'</b></div><div class="fact"><span>평가손익</span><b class="'+tone((price-o.entry_price)*o.shares)+'">'+won((price-o.entry_price)*o.shares)+'</b></div><div class="fact"><span>기간 최고가</span><b>'+(o.peak?num(o.peak):'—')+'</b></div></div></section></div><button class="back" style="margin-top:16px" onclick="go(\'/account/'+id+'\')">'+m.name+'로 돌아가기</button>'+footer()}
function renderPerformance(){const c=DATA.combined_forward||{},rows=['ks_mid','kq_mid'].map(id=>({id,s:forward(id).summary,m:ACCOUNT_META[id]}));app.innerHTML=breadcrumb([{label:'계좌',path:'/'},{label:'통합 성과'}])+'<div class="account-head"><div><div class="eyebrow">Forward result</div><h1>통합 성과</h1><p class="lede">2026년 9월 이후 모의운용만 집계합니다. 과거 백테스트는 각 계좌 안에서 별도로 확인합니다.</p></div></div><div class="performance-grid"><div class="stat-card"><span>통합 손익</span><b class="'+tone(c.net_pnl_won)+'">'+won(c.net_pnl_won)+'</b></div><div class="stat-card"><span>수익률</span><b class="'+tone(c.return_on_seed_pct)+'">'+pct(c.return_on_seed_pct)+'</b></div><div class="stat-card"><span>실현손익</span><b class="'+tone(c.realized_won)+'">'+won(c.realized_won)+'</b></div><div class="stat-card"><span>평가손익</span><b class="'+tone(c.unrealized_won)+'">'+won(c.unrealized_won)+'</b></div></div><div class="section-head"><div><h2>계좌별 비교</h2></div><p>같은 포워드 기간 기준</p></div><section class="focus-list">'+rows.map(x=>'<button class="focus-row" onclick="go(\'/account/'+x.id+'?tab=performance\')"><div><span class="stock-name">'+x.m.name+'</span><span class="stock-sub">보유 '+x.s.open_count+' · 청산 '+x.s.closed_count+'</span></div><div class="cell"><span class="cell-label">수익률</span><strong class="'+tone(x.s.return_on_seed_pct)+'">'+pct(x.s.return_on_seed_pct)+'</strong></div><div class="cell"><span class="cell-label">실현손익</span><span>'+won(x.s.realized_won)+'</span></div><div class="cell"><span class="cell-label">평가손익</span><span>'+won(x.s.unrealized_won)+'</span></div></button>').join('')+'</section>'+footer()}
function render(){if(LOAD_ERROR){app.innerHTML='<div class="empty">데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';return}if(!DATA)return;const r=parseRoute();document.getElementById('nav-home').classList.toggle('on',r.parts[0]!=='performance');document.getElementById('nav-performance').classList.toggle('on',r.parts[0]==='performance');if(r.parts[0]==='performance')renderPerformance();else if(r.parts[0]==='account'&&r.parts[1]&&r.parts[2]==='stock'&&r.parts[3])renderStock(r.parts[1],r.parts[3]);else if(r.parts[0]==='account'&&r.parts[1])renderAccount(r.parts[1],r.query.get('tab')||'hold');else renderHome();window.scrollTo(0,0)}
function validPortfolio(d){return Boolean(d&&d.meta&&d.accounts&&d.accounts.ks_mid&&d.accounts.kq_mid)}
async function fetchJson(url,timeoutMs){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
function liveUrl(){const cfg=window.TRADING_MASTER_CONFIG||{},direct=String(cfg.snapshotUrl||'').trim();if(direct)return direct;const origin=String(cfg.apiOrigin||'').replace(/\/$/,'');if(!origin)return null;return origin+String(cfg.snapshotPath||'/api/v2/snapshot')}
function setData(payload,mode){const portfolio=payload?.portfolio||payload;if(!validPortfolio(portfolio))throw new Error('Invalid portfolio payload');DATA=portfolio;REFERENCE_QUOTES=payload?.reference_quotes||{};LOAD_ERROR=null;DATA_MODE=mode;const status=document.querySelector('.status'),stamp=portfolio.meta.generated_at||'';status.classList.toggle('live',mode==='live');status.classList.remove('error');document.getElementById('header-status').textContent=(mode==='live'?'운영 데이터 ':'스냅샷 ')+stamp;render()}
async function loadData(){const cfg=window.TRADING_MASTER_CONFIG||{},endpoint=liveUrl(),timeout=Number(cfg.timeoutMs)||3500;clearTimeout(refreshTimer);if(endpoint){try{setData(await fetchJson(endpoint,timeout),'live');refreshTimer=setTimeout(loadData,Number(cfg.refreshMs)||300000);return}catch(err){console.warn('Live data unavailable; using snapshot.',err);refreshTimer=setTimeout(loadData,Number(cfg.retryMs)||60000)}}try{setData(await fetchJson('./api/v2-portfolio.json',timeout),'snapshot')}catch(err){LOAD_ERROR=true;const status=document.querySelector('.status');status.classList.add('error');document.getElementById('header-status').textContent='데이터 연결 오류';render()}}
window.addEventListener('hashchange',render);loadData();
</script>
