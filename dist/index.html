<script>
const ACCOUNT_META={ks_mid:{name:'코스피',market:'KOSPI',desc:'대형주·중형주 중심 모의계좌'},kq_mid:{name:'코스닥',market:'KOSDAQ',desc:'성장주 중심 모의계좌'}};
let DATA=null,WATCHLIST=null,REFERENCE_QUOTES={},LOAD_ERROR=null,DATA_MODE='loading',refreshTimer=null,currentPath=null;
const app=document.getElementById('app'),routeScroll=new Map(),accountTabMemory={ks_mid:'hold',kq_mid:'hold'};
const finite=n=>n!=null&&n!==''&&Number.isFinite(Number(n));
const num=n=>finite(n)?Math.round(Number(n)).toLocaleString('ko-KR'):'—',won=n=>finite(n)?num(n)+'원':'—';
const pct=n=>finite(n)?(Number(n)>=0?'+':'')+Number(n).toFixed(2)+'%':'—',tone=n=>Number(n)>0?'up':Number(n)<0?'down':'neutral';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const signedWon=n=>finite(n)?(Number(n)>0?'+':'')+won(n):'—';
const bookCost=o=>finite(o.cost_basis_won)?Number(o.cost_basis_won):Number(o.shares)*Number(o.entry_price);
const holdingPnl=o=>Number(o.shares)*Number(o.current)-bookCost(o);
function account(id){return DATA?.accounts?.[id]||null}
function forward(id){return account(id)?.forward||null}
function dateValue(v){const s=String(v||'');return /^\d{8}$/.test(s)?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8):s}
function fmtDate(v){return v?dateValue(v).slice(0,10).replaceAll('-','.'):'—'}
function shortDate(v){return v?String(v).slice(5,10).replace('-','.'):''}
function dateTime(v){if(!v)return '—';return String(v).slice(0,16).replace('T',' ')}
function accountPath(id,tab='hold'){return '/account/'+id+(tab==='hold'?'':'?tab='+tab)}
function safePath(path){return typeof path==='string'&&path.startsWith('/')&&!path.startsWith('//')&&!/[<>]/.test(path)?path:'/'}
function routePath(){return safePath(location.hash.slice(1)||'/')}
function parseRoute(){const raw=routePath().split('?');return {path:routePath(),parts:raw[0].split('/').filter(Boolean),query:new URLSearchParams(raw.slice(1).join('?'))}}
function go(path,options={}){
  path=safePath(path);
  if(currentPath)routeScroll.set(currentPath,Number(window.scrollY)||0);
  const scroll=options.keepScroll?(Number(window.scrollY)||0):options.restore?(routeScroll.get(path)||0):0;
  if(window.history?.pushState){
    window.history.replaceState({...window.history.state,tm:true,scrollY:Number(window.scrollY)||0},'',location.hash||'#/');
    const state={tm:true,scrollY:scroll},parent=options.replace?window.history.state?.parent:currentPath;
    if(options.restore&&window.history.state?.parent===path){window.history.back();return}
    window.history[options.replace?'replaceState':'pushState']({...state,parent},'','#'+path);
    render({restoreScroll:scroll,focus:!options.keepScroll,preserve:options.keepScroll});
  }else{location.hash='#'+path}
}
function link(path,label,cls='',attrs=''){return '<a href="#'+esc(safePath(path))+'"'+(cls?' class="'+cls+'"':'')+(attrs?' '+attrs:'')+'>'+label+'</a>'}
function breadcrumb(items){return '<nav class="crumb" aria-label="현재 위치">'+items.map((x,i)=>i===items.length-1?'<span class="current" aria-current="page">'+esc(x.label)+'</span>':link(x.path,esc(x.label),'','data-restore="true"')+'<span class="crumb-separator" aria-hidden="true">/</span>').join('')+'</nav>'}
function footer(){return '<footer class="notice"><span>모의운용 기록 · 수수료·세금·슬리피지 미반영. 평가 가격은 네이버 일봉 데이터이며, KRX 종가는 별도 참고 시세입니다.</span><span>TRADING MASTER / PAPER</span></footer>'}
function pageHead(title,kicker,description,aside=''){return '<div class="page-head"><div><div class="eyebrow">'+esc(kicker)+'</div><h1 id="main-content" tabindex="-1">'+esc(title)+'</h1>'+(description?'<p class="lede">'+description+'</p>':'')+'</div>'+aside+'</div>'}
function emptyState(title,copy,path,label){return '<div class="empty"><b>'+esc(title)+'</b>'+esc(copy)+(path?'<div>'+link(path,esc(label),'back-link')+'</div>':'')+'</div>'}
function balanceAmount(b,key){return b?.available&&finite(b[key])?won(b[key]):'—'}
function trackingSummary(t){
  if(!t?.available)return '<div class="tracking-note">자산 변동 기준을 확인 중입니다.</div>';
  return '<div class="tracking-note"><div class="tracking-primary"><strong class="'+tone(t.equity_change_won)+'">자산 변동 '+(Number(t.equity_change_won)>=0?'+':'')+won(t.equity_change_won)+' ('+pct(t.equity_change_pct)+')</strong><span class="tracking-base">비교 기준 '+esc(dateTime(t.baseline_at))+' KST</span></div><span class="tracking-detail">입출금 조정 전 총자산 변동</span></div>';
}
function balanceSummary(b,t){return '<section class="balance-strip" aria-label="모의계좌 잔고"><div><span>현재 총자산</span><b>'+balanceAmount(b,'account_value_won')+'</b></div><div><span>현금</span><b>'+balanceAmount(b,'cash_won')+'</b></div><div><span>보유 평가액</span><b>'+balanceAmount(b,'holdings_value_won')+'</b></div></section>'+trackingSummary(t)}
function capitalNote(seed){return '<details class="basis-info" id="capital-basis"><summary>손익률 계산 기준</summary><p class="capital-note">종잣돈 대비 손익률은 최초 종잣돈 '+won(seed)+'을 기준으로 계산합니다. 기간 시작 잔고 대비 계좌 수익률과 구분합니다. 총자산에는 과거 백테스트에서 이어진 모의자산이 포함됩니다.</p></details>'}
function accountCard(id){
  const a=account(id),s=a?.forward?.summary||{},m=ACCOUNT_META[id];
  return link(accountPath(id),'<div class="account-card-head"><div class="account-title"><h3>'+m.name+'</h3><span class="market">'+m.market+'</span></div><span class="account-count">보유 '+(s.open_count||0)+'</span></div><div class="account-card-main"><div><span class="metric-caption">현재 총자산</span><div class="asset">'+balanceAmount(a?.balance,'account_value_won')+'</div></div><div><span class="metric-caption">포워드 거래손익</span><div class="return '+tone(s.net_pnl_won)+'">'+signedWon(s.net_pnl_won)+'</div></div></div><div class="account-card-foot"><span>청산 <b>'+(s.closed_count||0)+'건</b></span><span>종잣돈 대비 <b class="'+tone(s.return_on_seed_pct)+'">'+pct(s.return_on_seed_pct)+'</b></span></div>','account-card','aria-label="'+m.name+' 계좌 보기"');
}
function tradeKey(o){return [o.code,o.entry_at||o.entry_date,o.exit_at||o.exit_date,o.entry_price,o.exit_price,o.shares].map(x=>String(x??'')).join('~')}
function stockPath(o,id,origin,closed=false){
  let path='/account/'+id+'/stock/'+encodeURIComponent(o.code)+'?back='+encodeURIComponent(safePath(origin||accountPath(id)));
  if(closed)path+='&trade='+encodeURIComponent(tradeKey(o));
  return path;
}
function tableHead(labels){return '<thead><tr>'+labels.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead>'}
function cell(label,value,cls=''){return '<td'+(cls?' class="'+cls+'"':'')+'><span class="cell-label">'+label+'</span>'+value+'</td>'}
function stockRow(o,id,compact=false,origin){
  const gap=finite(o.current)&&Number(o.current)>0&&finite(o.stop)?(Number(o.current)-Number(o.stop))/Number(o.current)*100:null;
  const path=stockPath(o,id,origin||accountPath(id));
  const name=link(path,'<span class="stock-name">'+esc(o.name)+'</span><span class="stock-sub">'+esc(o.code)+' · '+(compact?ACCOUNT_META[id].name:shortDate(o.entry_date)+' 편입 · '+(o.days||0)+'일')+'</span>','stock-link');
  let row='<tr data-href="'+esc(path)+'"><td>'+name+'</td>'+cell('현재가','<strong>'+num(o.current)+'</strong>')+cell('진입 대비','<strong class="'+tone(o.pnl_pct)+'">'+pct(o.pnl_pct)+'</strong>');
  if(compact)row+=cell('보호선','<span class="table-number">'+num(o.stop)+'</span>');
  else row+=cell('평가손익','<strong class="'+tone(holdingPnl(o))+'">'+signedWon(holdingPnl(o))+'</strong>')+cell('보호 여유',gap==null?'—':(gap<0?'<span class="status-badge broken">보호선 이탈</span>':'<span>'+gap.toFixed(1)+'%</span>')+'<span class="stop-meta">'+num(o.stop)+'</span>');
  return row+'</tr>';
}
function holdingTable(open,id,compact=false,origin){
  const rows=open.map(o=>stockRow(o,id||o._account,compact,origin)).join('');
  return '<div class="table-wrap"><table class="data-table responsive '+(compact?'compact':'')+'" aria-label="'+(compact?'주요 보유 종목':'계좌 보유 종목')+'">'+tableHead(compact?['종목','현재가','진입 대비','보호선']:['종목','현재가','진입 대비','평가손익','보호 여유'])+'<tbody>'+rows+'</tbody></table><div class="table-foot"><span>진입 대비 수익률 · 가격은 데이터 기준 시점</span><span>'+open.length+'종목</span></div></div>';
}
function watchOptions(query=parseRoute().query){return {market:query.get('market')==='KOSDAQ'?'KOSDAQ':'KOSPI',filter:['unheld','held'].includes(query.get('filter'))?query.get('filter'):'all',sort:['turnover','gap'].includes(query.get('sort'))?query.get('sort'):'rank',limit:Math.max(30,Math.min(600,Number(query.get('limit'))||30)),history:query.get('history')==='all'}}
function watchPath(options={}){const p=new URLSearchParams();for(const k of ['market','filter','sort','limit','history'])if(options[k]!=null&&(k!=='history'||options[k]))p.set(k,k==='history'?'all':options[k]);return '/'+(p.size?'?'+p.toString():'')}
function watchStockPath(row,back=routePath()){return '/watch/'+row.market+'/'+row.code+'?back='+encodeURIComponent(safePath(back))}
function watchRow(market,code){return WATCHLIST?.items?.find(x=>x.market===market&&String(x.code)===String(code))||null}
function entryGap(row){return row.selected&&finite(row.price)&&Number(row.price)>0&&finite(row.entry_ceiling)?(Number(row.entry_ceiling)-Number(row.price))/Number(row.price)*100:null}
function watchState(row){if(row.selection_status==='unavailable')return {label:'계산 확인 중',cls:'muted'};if(!row.selected)return {label:row.selection_status==='rank_excluded'?'선정 범위 밖':row.selection_status==='universe_excluded'?'수집 범위 밖':'선정 조건 해제',cls:'muted'};if(row.entry_stop_breached)return {label:'진입 조건 제한',cls:'limited'};if(row.entry_condition_status==='blocked')return {label:'진입 상단 초과',cls:'limited'};return {label:'선정 조건 유지',cls:'ready'}}
function watchRows(o){let rows=(WATCHLIST?.items||[]).filter(x=>x.market===o.market&&!x.retired);if(o.filter==='held')rows=rows.filter(x=>x.position_status==='held');if(o.filter==='unheld')rows=rows.filter(x=>x.position_status!=='held');return rows.slice().sort((a,b)=>o.sort==='turnover'?(Number(b.turnover_avg20)||0)-(Number(a.turnover_avg20)||0):o.sort==='gap'?(entryGap(b)??-Infinity)-(entryGap(a)??-Infinity):(a.engine_rank??999)-(b.engine_rank??999)||a.code.localeCompare(b.code))}
function watchReasons(row){const c=row.conditions||{};if(row.selection_status==='unavailable')return '최신 계산 확인 중';if(!row.selected)return row.selection_status==='rank_excluded'?'신호 유지 · 선정 순위 범위 밖':row.selection_reason==='sell_response_grade'?'매도 대응 등급 제외':row.selection_reason==='liquidity_below_minimum'?'거래대금 기준 미달':'주·월 조건 재확인';return [c.weekly_rising?'주봉 기준가 상승':null,c.weekly_price_supported?'주봉 지지':null,c.monthly_buy_signal?'월봉 매수 신호':null].filter(Boolean).join(' · ')}
function watchTable(rows,origin){return '<div class="table-wrap watch-table-wrap"><table class="data-table responsive watch-table" aria-label="시장별 관심종목">'+tableHead(['종목 / 선정 상태','평가 가격','진입 상단','상단까지','선정 근거'])+'<tbody>'+rows.map(row=>{const s=watchState(row),gap=entryGap(row),path=watchStockPath(row,origin);return '<tr data-href="'+esc(path)+'"><td>'+link(path,'<span class="watch-name-line"><span class="stock-name">'+esc(row.name)+'</span>'+(row.position_status==='held'?'<span class="holding-chip">모의 보유</span>':'')+'</span><span class="stock-sub">'+esc(row.code)+(row.industry?' · '+esc(row.industry):'')+'</span><span class="watch-status '+s.cls+'">'+s.label+'</span>','stock-link')+'</td>'+cell('평가 가격','<strong>'+num(row.price)+'</strong><span class="stock-sub">'+esc(shortDate(row.price_date))+(row.price_freshness!=='current_cycle'?' · 이전 관측':'')+'</span>')+cell('진입 상단','<strong>'+num(row.selected?row.entry_ceiling:null)+'</strong>')+cell('상단까지',gap==null?'—':'<span class="gap-value '+(gap<0?'limited':'')+'">'+pct(gap)+'</span>')+cell('선정 근거','<span class="reason-inline">'+esc(watchReasons(row))+'</span><span class="stock-sub">20일 평균 거래대금 '+(finite(row.turnover_avg20)?num(Number(row.turnover_avg20)/1e8)+'억':'—')+'</span>','reason-cell')+'</tr>'}).join('')+'</tbody></table></div>'}
function eventLabel(e){return {candidate_added:'관심종목 추가',candidate_returned:'선정 조건 재진입',candidate_removed:e.reason==='rank_excluded'?'선정 범위 밖 이동':'선정 조건 해제',entry_condition_changed:e.current==='met'?'진입 가격 조건 충족':'진입 가격 조건 변경',paper_entry:'모의계좌 편입',paper_add:'모의계좌 추가매수',paper_exit:'모의계좌 청산'}[e.type]||'관측 변화'}
function watchEvents(market,code=null,all=false){const events=(WATCHLIST?.events||[]).filter(e=>e.market===market&&(!code||e.code===code));const displayed=events.slice(0,all?events.length:6);return displayed.length?'<ol class="change-list">'+displayed.map(e=>{const row=watchRow(e.market,e.code),name=esc(e.name||row?.name||e.code),target=row?watchStockPath(row):null;return '<li><div class="change-heading">'+(target?link(target,name,'change-stock'):name)+'<time>'+esc(dateTime(e.observed_at))+'</time></div><div class="change-action">'+esc(eventLabel(e))+'</div>'+(e.type.startsWith('paper_')?'<div class="stock-sub">'+num(e.shares)+'주 · '+won(e.price)+' · '+won(e.amount_won)+'</div>':'')+'</li>'}).join('')+'</ol>':'<div class="change-empty">추적 시작 이후 관측된 변화가 없습니다.</div>'}
function renderWatchlist(query=parseRoute().query){
 const o=watchOptions(query),m=ACCOUNT_META[o.market==='KOSPI'?'ks_mid':'kq_mid'],origin=watchPath(o),rows=watchRows(o);
 const marketCards=['KOSPI','KOSDAQ'].map(market=>{const info=WATCHLIST?.markets?.[market],name=market==='KOSPI'?'코스피':'코스닥';return link(watchPath({...o,market,limit:30}),'<div class="market-selector-label">'+name+'<span>'+market+'</span></div><div class="market-selector-count">'+(info?info.selected_count:'—')+'<small>선정종목</small><span class="market-held">모의 보유 '+(info?info.held_count:'—')+'</span></div>','market-selector '+(o.market===market?'on':''),o.market===market?'aria-current="page"':'')}).join('');
 const status=WATCHLIST?.markets?.[o.market]?.evaluation_status==='partial'?'<p class="watch-alert">일부 종목의 최신 계산을 확인 중입니다. 해당 종목은 조건 해제로 처리하지 않습니다.</p>':'';

function validRootWaveModel(m,f){
 if(m==null)return true;
 const n=v=>typeof v==='number'&&Number.isFinite(v),date=v=>typeof v==='string'&&/^\d{8}$/.test(v);
 if(m.version!=='root-linked-wave-v1'||m.execution_policy!=='display_only'||!Array.isArray(m.items)||!Array.isArray(f.bars)||f.bars_count!==f.bars.length)return false;
 const status=f.status==='unavailable'?'unavailable':f.bars.length>=9?'available':'insufficient_history';if(m.status!==status)return false;
 const dates=new Set(f.bars.map(b=>b[0]));let previous='';
 for(const w of m.items){
  if(!date(w.born_at)||w.id!==w.born_at||w.born_at<=previous||!date(w.confirmed_at)||!(w.born_at<w.confirmed_at&&w.confirmed_at<=f.price_date)||!dates.has(w.born_at)||!dates.has(w.confirmed_at)||!['active','invalidated'].includes(w.state)||![null,'reversal','rebound','expansion'].includes(w.phase))return false;previous=w.born_at;
  if(![w.low,w.high,w.center,w.root_reference].every(v=>n(v)&&v>0)||w.high<w.low||w.center<w.low||w.center>w.high||w.root_reference<w.low||w.root_reference>w.high)return false;
  if(![w.advances,w.retreats,w.center_breaks,w.age_bars].every(v=>Number.isInteger(v)&&v>=0)||w.age_bars<1||w.retreats>w.advances||w.retreats>w.center_breaks)return false;
  if(w.state==='active'){if(w.invalidated_at!==null||w.root_reference>=f.price)return false}else if(!date(w.invalidated_at)||!dates.has(w.invalidated_at)||w.invalidated_at<w.confirmed_at||w.invalidated_at>f.price_date)return false;
  if(!Array.isArray(w.trajectory)||!w.trajectory.length||w.trajectory[0][0]!==w.born_at||w.trajectory.at(-1)[1]!==w.center)return false;
  const start=f.bars.findIndex(b=>b[0]===w.born_at),end=w.state==='active'?f.bars.length:f.bars.findIndex(b=>b[0]===w.invalidated_at);
  if(w.trajectory.length!==end-start||w.age_bars!==(w.state==='active'?end-1:end)-start)return false;
  for(let i=0;i<w.trajectory.length;i++){const p=w.trajectory[i];if(!Array.isArray(p)||p.length!==2||p[0]!==f.bars[start+i][0]||!n(p[1])||p[1]<=0)return false}
 }
 const supports=m.items.filter(w=>w.state==='active'&&w.center<f.price).sort((a,b)=>b.center-a.center||b.born_at.localeCompare(a.born_at));
 return m.representative_id===(supports[0]?.id??null);
}

function validStockAnalysis(a,row,w){
 if(a==null)return true;
 const n=v=>typeof v==='number'&&Number.isFinite(v),same=(a,b)=>n(a)&&n(b)&&Math.abs(a-b)<=Math.max(1e-7,Math.abs(b)*1e-10),date=v=>typeof v==='string'&&/^\d{8}$/.test(v);

 if(!d||!l||!g||d.generated_at!==w.generated_at||d.timeframe!=='day'||d.completed_only!==false||d.retest_status!=='not_evaluated'||d.execution_policy!=='existing_paper_plans_only'||!same(d.price,row.price)||d.price_date!==String(row.price_date).replaceAll('-','')||!Object.values(l).every(n)||!Array.isArray(d.checks)||d.checks.some(x=>typeof x.label!=='string'||typeof x.passed!=='boolean')||!Number.isInteger(d.signal_count)||d.signal_total!==9||d.signal_count<0||d.signal_count>9)return false;
 if(!same(l.max_buy,l.gijunga_min*1.10)||g.within_daily_ceiling!==(d.price<=l.max_buy)||g.above_daily_stop!==(d.price>l.stop)||g.reference_rising!==(l.gijunga>l.prev_gijunga)||typeof g.buy_signal!=='boolean')return false;

 if(a.root_linked_wave_status==='available'&&(a.root_phase_basis!=='60_20_completed_bars'||Object.values(a.frames).some(f=>!f.root_waves)))return false;

function validPortfolio(d){return Boolean(d&&d.meta&&d.accounts&&d.accounts.ks_mid&&d.accounts.kq_mid)}
function validWatchlist(w,p){

async function fetchJson(url,timeoutMs){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}

async function loadData(){
