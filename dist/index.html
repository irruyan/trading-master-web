<!doctype html>
<html lang="ko">
<head>

<meta name="description" content="코스피·코스닥 모의계좌의 잔고, 보유 종목과 포워드 거래 기록.">

<body>

</aside>
<div class="workspace">
  <header class="topbar">
    <a class="mobile-brand" href="#/"><span class="brandmark">TM</span>TRADING MASTER</a>

    <div class="status" aria-live="polite"><span class="status-tag" id="status-tag">데이터 확인</span><span id="header-status">운용 기록을 불러오는 중</span></div>
  </header>
  <main id="app" class="shell" aria-label="운용 정보"><div class="loading"><span class="loader" aria-hidden="true"></span><span>운용 기록을 불러오는 중입니다.</span></div></main>
</div>
<nav class="mobile-nav" aria-label="모바일 주요 메뉴">
  <a id="mobile-home" href="#/"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>현황</span></a>
  <a id="mobile-ks_mid" href="#/account/ks_mid"><span class="market-code">KS</span><span>코스피</span></a>
  <a id="mobile-kq_mid" href="#/account/kq_mid"><span class="market-code">KQ</span><span>코스닥</span></a>
  <a id="mobile-performance" href="#/performance"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v17h17M8 16v-4m5 4V7m5 9V4"/></svg><span>성과</span></a>
</nav>
<script>
const ACCOUNT_META={ks_mid:{name:'코스피',market:'KOSPI',desc:'대형주·중형주 중심 모의계좌'},kq_mid:{name:'코스닥',market:'KOSDAQ',desc:'성장주 중심 모의계좌'}};
let DATA=null,REFERENCE_QUOTES={},LOAD_ERROR=null,DATA_MODE='loading',refreshTimer=null,currentPath=null;
const app=document.getElementById('app'),routeScroll=new Map(),accountTabMemory={ks_mid:'hold',kq_mid:'hold'};
const finite=n=>n!=null&&n!==''&&Number.isFinite(Number(n));
const num=n=>finite(n)?Math.round(Number(n)).toLocaleString('ko-KR'):'—',won=n=>finite(n)?num(n)+'원':'—';
const pct=n=>finite(n)?(Number(n)>=0?'+':'')+Number(n).toFixed(2)+'%':'—',tone=n=>Number(n)>0?'up':Number(n)<0?'down':'neutral';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const signedWon=n=>finite(n)?(Number(n)>0?'+':'')+won(n):'—';
const bookCost=o=>finite(o.cost_basis_won)?Number(o.cost_basis_won):Number(o.shares)*Number(o.entry_price);
const holdingPnl=o=>Number(o.shares)*Number(o.current)-bookCost(o);
function account(id){return DATA?.accounts?.[id]||null}
function forward(id){return account(id)?.forward||null}
function fmtDate(v){return v?String(v).slice(0,10).replaceAll('-','. '):'—'}
function shortDate(v){return v?String(v).slice(5,10).replace('-','.'):''}
function dateTime(v){if(!v)return '—';return String(v).slice(0,16).replace('T',' ')}
function accountPath(id,tab='hold'){return '/account/'+id+(tab==='hold'?'':'?tab='+tab)}
function safePath(path){return typeof path==='string'&&path.startsWith('/')&&!path.startsWith('//')&&!/[<>]/.test(path)?path:'/'}
function routePath(){return safePath(location.hash.slice(1)||'/')}
function parseRoute(){const raw=routePath().split('?');return {path:routePath(),parts:raw[0].split('/').filter(Boolean),query:new URLSearchParams(raw.slice(1).join('?'))}}
function go(path,options={}){
  path=safePath(path);
  if(currentPath)routeScroll.set(currentPath,Number(window.scrollY)||0);
  const scroll=options.restore?(routeScroll.get(path)||0):0;
  if(window.history?.pushState){
    window.history.replaceState({...window.history.state,tm:true,scrollY:Number(window.scrollY)||0},'',location.hash||'#/');
    const state={tm:true,scrollY:scroll};
    if(options.restore&&window.history.state?.parent===path){window.history.back();return}
    window.history[options.replace?'replaceState':'pushState']({...state,parent:currentPath},'','#'+path);
    render({restoreScroll:scroll,focus:true});
  }else{location.hash='#'+path}
}
function link(path,label,cls='',attrs=''){return '<a href="#'+esc(safePath(path))+'"'+(cls?' class="'+cls+'"':'')+(attrs?' '+attrs:'')+'>'+label+'</a>'}
function breadcrumb(items){return '<nav class="crumb" aria-label="현재 위치">'+items.map((x,i)=>i===items.length-1?'<span class="current" aria-current="page">'+esc(x.label)+'</span>':link(x.path,esc(x.label),'','data-restore="true"')+'<span class="crumb-separator" aria-hidden="true">/</span>').join('')+'</nav>'}
function footer(){return '<footer class="notice"><span>모의운용 기록 · 수수료·세금·슬리피지 미반영. 평가 가격은 네이버 일봉 데이터이며, KRX 종가는 별도 참고 시세입니다.</span><span>TRADING MASTER / PAPER</span></footer>'}
function pageHead(title,kicker,description,aside=''){return '<div class="page-head"><div><div class="eyebrow">'+esc(kicker)+'</div><h1 id="main-content" tabindex="-1">'+esc(title)+'</h1>'+(description?'<p class="lede">'+description+'</p>':'')+'</div>'+aside+'</div>'}
function emptyState(title,copy,path,label){return '<div class="empty"><b>'+esc(title)+'</b>'+esc(copy)+(path?'<div>'+link(path,esc(label),'back-link')+'</div>':'')+'</div>'}
function balanceAmount(b,key){return b?.available&&finite(b[key])?won(b[key]):'—'}
function trackingSummary(t){
  if(!t?.available)return '<div class="tracking-note">자산 변동 기준을 확인 중입니다.</div>';
  return '<div class="tracking-note"><div class="tracking-primary"><strong class="'+tone(t.equity_change_won)+'">자산 변동 '+(Number(t.equity_change_won)>=0?'+':'')+won(t.equity_change_won)+' ('+pct(t.equity_change_pct)+')</strong><span class="tracking-base">비교 기준 '+esc(dateTime(t.baseline_at))+' KST</span></div><span class="tracking-detail">입출금 조정 전 총자산 변동</span></div>';
}
function balanceSummary(b,t){return '<section class="balance-strip" aria-label="모의계좌 잔고"><div><span>현재 총자산</span><b>'+balanceAmount(b,'account_value_won')+'</b></div><div><span>현금</span><b>'+balanceAmount(b,'cash_won')+'</b></div><div><span>보유 평가액</span><b>'+balanceAmount(b,'holdings_value_won')+'</b></div></section>'+trackingSummary(t)}
function capitalNote(seed){return '<details class="basis-info" id="capital-basis"><summary>손익률 계산 기준</summary><p class="capital-note">종잣돈 대비 손익률은 최초 종잣돈 '+won(seed)+'을 기준으로 계산합니다. 기간 시작 잔고 대비 계좌 수익률과 구분합니다. 총자산에는 과거 백테스트에서 이어진 모의자산이 포함됩니다.</p></details>'}
function accountCard(id){
  const a=account(id),s=a?.forward?.summary||{},m=ACCOUNT_META[id];
  return link(accountPath(id),'<div class="account-card-head"><div class="account-title"><h3>'+m.name+'</h3><span class="market">'+m.market+'</span></div><span class="account-count">보유 '+(s.open_count||0)+'</span></div><div class="account-card-main"><div><span class="metric-caption">현재 총자산</span><div class="asset">'+balanceAmount(a?.balance,'account_value_won')+'</div></div><div><span class="metric-caption">포워드 거래손익</span><div class="return '+tone(s.net_pnl_won)+'">'+signedWon(s.net_pnl_won)+'</div></div></div><div class="account-card-foot"><span>청산 <b>'+(s.closed_count||0)+'건</b></span><span>종잣돈 대비 <b class="'+tone(s.return_on_seed_pct)+'">'+pct(s.return_on_seed_pct)+'</b></span></div>','account-card','aria-label="'+m.name+' 계좌 보기"');
}
function tradeKey(o){return [o.code,o.entry_at||o.entry_date,o.exit_at||o.exit_date,o.entry_price,o.exit_price,o.shares].map(x=>String(x??'')).join('~')}
function stockPath(o,id,origin,closed=false){
  let path='/account/'+id+'/stock/'+encodeURIComponent(o.code)+'?back='+encodeURIComponent(safePath(origin||accountPath(id)));
  if(closed)path+='&trade='+encodeURIComponent(tradeKey(o));
  return path;
}
function tableHead(labels){return '<thead><tr>'+labels.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead>'}
function cell(label,value,cls=''){return '<td'+(cls?' class="'+cls+'"':'')+'><span class="cell-label">'+label+'</span>'+value+'</td>'}
function stockRow(o,id,compact=false,origin){
  const gap=finite(o.current)&&Number(o.current)>0&&finite(o.stop)?(Number(o.current)-Number(o.stop))/Number(o.current)*100:null;
  const path=stockPath(o,id,origin||accountPath(id));
  const name=link(path,'<span class="stock-name">'+esc(o.name)+'</span><span class="stock-sub">'+esc(o.code)+' · '+(compact?ACCOUNT_META[id].name:shortDate(o.entry_date)+' 편입 · '+(o.days||0)+'일')+'</span>','stock-link');
  let row='<tr data-href="'+esc(path)+'"><td>'+name+'</td>'+cell('현재가','<strong>'+num(o.current)+'</strong>')+cell('진입 대비','<strong class="'+tone(o.pnl_pct)+'">'+pct(o.pnl_pct)+'</strong>');
  if(compact)row+=cell('보호선','<span class="table-number">'+num(o.stop)+'</span>');
  else row+=cell('평가손익','<strong class="'+tone(holdingPnl(o))+'">'+signedWon(holdingPnl(o))+'</strong>')+cell('보호 여유',gap==null?'—':(gap<0?'<span class="status-badge broken">보호선 이탈</span>':'<span>'+gap.toFixed(1)+'%</span>')+'<span class="stop-meta">'+num(o.stop)+'</span>');
  return row+'</tr>';
}
function holdingTable(open,id,compact=false,origin){
  const rows=open.map(o=>stockRow(o,id||o._account,compact,origin)).join('');
  return '<div class="table-wrap"><table class="data-table responsive '+(compact?'compact':'')+'" aria-label="'+(compact?'주요 보유 종목':'계좌 보유 종목')+'">'+tableHead(compact?['종목','현재가','진입 대비','보호선']:['종목','현재가','진입 대비','평가손익','보호 여유'])+'<tbody>'+rows+'</tbody></table><div class="table-foot"><span>진입 대비 수익률 · 가격은 데이터 기준 시점</span><span>'+open.length+'종목</span></div></div>';
}
function renderHome(){
  const b=DATA.combined_balance||{},ids=['ks_mid','kq_mid'],open=ids.flatMap(id=>(forward(id)?.open||[]).map(o=>({...o,_account:id}))).sort((a,b)=>Math.abs(b.pnl_pct)-Math.abs(a.pnl_pct));
  const held=b.available&&Number(b.account_value_won)>0?Math.max(0,Math.min(100,Number(b.holdings_value_won)/Number(b.account_value_won)*100)):null;
  const allocation=held==null?'':'<div class="allocation-bar" role="img" aria-label="보유 평가액 '+held.toFixed(1)+'%, 현금 '+(100-held).toFixed(1)+'%"><span class="holdings" style="width:'+held+'%"></span><span class="cash" style="width:'+(100-held)+'%"></span></div><div class="allocation-legend"><span>보유 '+held.toFixed(1)+'%</span><span>현금 '+(100-held).toFixed(1)+'%</span></div>';
  app.innerHTML=pageHead('운용 현황','PORTFOLIO / OVERVIEW','코스피·코스닥 모의계좌','<span class="page-tag">포워드 '+fmtDate(DATA.meta.forward_start_date)+' 이후</span>')+'<section class="overview" aria-label="통합 잔고"><div class="overview-main"><div class="overview-label">현재 총자산</div><div class="overview-value">'+balanceAmount(b,'account_value_won')+'</div><div class="overview-note">코스피 · 코스닥 합계 · 백테스트에서 이어진 모의자산 포함</div></div><div class="overview-side"><div class="allocation-values"><div class="allocation-value"><span>보유 평가액</span><b>'+balanceAmount(b,'holdings_value_won')+'</b></div><div class="allocation-value"><span>현금</span><b>'+balanceAmount(b,'cash_won')+'</b></div></div>'+allocation+'</div></section>'+trackingSummary(DATA.combined_equity_tracking)+'<div class="section-head"><h2>운용 계좌</h2>'+link('/performance','통합 성과','text-link')+'</div><section class="accounts" aria-label="시장별 모의계좌">'+ids.map(accountCard).join('')+'</section><div class="section-head"><h2>변동이 큰 보유 종목</h2><p>진입 대비 절대 수익률 순</p></div>'+(open.length?holdingTable(open.slice(0,6),null,true,'/'):emptyState('보유 종목이 없습니다.','거래 기록이 생성되면 이곳에 표시됩니다.'))+footer();
}
function accountSummary(id){
  const a=account(id),s=forward(id).summary;
  return balanceSummary(a.balance,a.equity_tracking)+'<section class="summary-strip" aria-label="포워드 거래손익"><div class="summary-cell primary"><span>포워드 거래손익</span><b class="'+tone(s.net_pnl_won)+'">'+signedWon(s.net_pnl_won)+'</b></div><div class="summary-cell"><span>실현손익</span><b class="'+tone(s.realized_won)+'">'+signedWon(s.realized_won)+'</b></div><div class="summary-cell"><span>평가손익</span><b class="'+tone(s.unrealized_won)+'">'+signedWon(s.unrealized_won)+'</b></div><div class="summary-cell"><span>종잣돈 대비 손익률</span><b class="'+tone(s.return_on_seed_pct)+'">'+pct(s.return_on_seed_pct)+'</b><span class="stock-sub">종잣돈 '+won(a.seed)+'</span></div></section>'+capitalNote(a.seed);
}
function accountTabs(id,tab){
  const s=forward(id).summary;
  return '<nav class="tabs" aria-label="계좌 보기">'+[['hold','보유',s.open_count],['closed','청산',s.closed_count],['performance','성과',null]].map(x=>link(accountPath(id,x[0]),x[1]+(x[2]==null?'':'<span class="tab-count">'+x[2]+'</span>'),'tab '+(tab===x[0]?'on':''),tab===x[0]?'aria-current="page"':'')).join('')+'</nav>';
}
function historicalPerformance(a){
  const h=a.historical||{},s=h.summary;
  if(!s||h.coverage?.complete!==true)return '<div class="empty">과거 전체 기록이 확인되지 않아 성과 집계를 표시하지 않습니다.</div>';
  const ratio=s.profit_loss_ratio==null?'산출 불가':Number(s.profit_loss_ratio).toLocaleString('ko-KR',{maximumFractionDigits:2}),reason={no_closed_trades:'청산 기록 없음',no_winning_trades:'이익 거래 없음',no_losing_trades:'손실 거래 없음',no_loss_amount:'평균 손실이 0'}[s.profit_loss_ratio_status];
  return '<div class="history-content"><div class="stat-card"><span>청산 거래</span><b>'+s.closed_count+'건</b></div><div class="stat-card"><span>승률</span><b>'+s.win_rate+'%</b></div><div class="stat-card"><span>손익비</span><b>'+ratio+'</b>'+(reason?'<span class="stock-sub">'+reason+'</span>':'')+'</div><div class="stat-card"><span>실현손익</span><b class="'+tone(s.realized_won)+'">'+won(s.realized_won)+'</b></div></div><p class="source-note">'+fmtDate(a.forward.start_date)+' 이전 청산 기록 · 포워드 성과와 별도 집계</p>';
}
function closedTable(closed,id){
  const origin=accountPath(id,'closed');
  const rows=closed.map(o=>{
    const path=stockPath(o,id,origin,true);
    return '<tr data-href="'+esc(path)+'"><td>'+link(path,'<span class="stock-name">'+esc(o.name)+'</span><span class="stock-sub">'+esc(o.code)+' · '+esc(o.reason||'청산 기록')+'</span>','stock-link')+'</td>'+cell('청산일',fmtDate(o.exit_date))+cell('진입가',num(o.entry_price))+cell('청산가',num(o.exit_price))+cell('실현손익','<strong class="'+tone(o.pnl_won)+'">'+signedWon(o.pnl_won)+'</strong>')+cell('거래 수익률','<strong class="'+tone(o.pnl_pct)+'">'+pct(o.pnl_pct)+'</strong>')+'</tr>';
  }).join('');
  return '<div class="table-wrap"><table class="data-table responsive" aria-label="포워드 청산 기록">'+tableHead(['종목','청산일','진입가','청산가','실현손익','거래 수익률'])+'<tbody>'+rows+'</tbody></table><div class="table-foot"><span>'+fmtDate(forward(id).start_date)+' 이후 청산 기록</span><span>'+closed.length+'건</span></div></div>';
}
function forwardStats(s,id){
  const count=Number(s.closed_count)||0,wins=Number(s.win_count)||0,losses=Number(s.loss_count)||0,draws=Math.max(0,count-wins-losses);
  const winPct=count?wins/count*100:0,lossPct=count?losses/count*100:0;
  const extra=count?'<section class="score-section"><div class="score-header"><h3>청산 거래 구성</h3><span>'+count+'건</span></div><div class="win-bar" role="img" aria-label="이익 '+wins+'건, 손실 '+losses+'건, 보합 '+draws+'건"><i style="width:'+winPct+'%"></i><i style="width:'+lossPct+'%"></i></div><div class="win-legend"><span>이익 <b>'+wins+'건</b></span><span>손실 <b>'+losses+'건</b></span>'+(draws?'<span>보합 <b>'+draws+'건</b></span>':'')+'</div></section>':'';

function findStock(id,code,trade){
  const f=forward(id);if(!f)return null;
  if(trade)return (f.closed||[]).find(o=>String(o.code)===String(code)&&tradeKey(o)===trade)||null;
  return (f.open||[]).find(o=>String(o.code)===String(code))||(f.closed||[]).find(o=>String(o.code)===String(code))||null;
}
function chartSvg(hist,entry,stop){
  const arr=(hist||[]).filter(x=>finite(x.p)&&Number(x.p)>0).slice(-80);
  if(arr.length<2)return '<div class="empty-chart">가격 기록이 더 쌓이면 추이를 표시합니다.</div>';
  const values=arr.flatMap(x=>[+x.p,finite(x.s)&&Number(x.s)>0?+x.s:+x.p]).concat(finite(entry)?[+entry]:[]),low=Math.min(...values),high=Math.max(...values),pad=(high-low)*.1||high*.03||1,lo=low-pad,hi=high+pad,W=760,H=286,L=16,R=90,T=16,B=32,span=hi-lo;
  const y=v=>T+(H-T-B)*(1-(v-lo)/span),x=i=>L+i/(arr.length-1)*(W-L-R);
  const line=key=>{let d='',started=false;arr.forEach((v,i)=>{if(!finite(v[key])||Number(v[key])<=0){started=false;return}d+=(started?'L':'M')+x(i).toFixed(1)+' '+y(+v[key]).toFixed(1)+' ';started=true});return d};
  let grid='';for(let i=0;i<4;i++){const yy=T+(H-T-B)*i/3,value=hi-(hi-lo)*i/3;grid+='<line class="chart-grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text x="'+(W-R+12)+'" y="'+(yy+4)+'">'+num(value)+'</text>'}
  const entryLine=finite(entry)?'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(+entry)+'" y2="'+y(+entry)+'" stroke="#b5c3d2" stroke-width="1" stroke-dasharray="5 5"/>':'';
  return '<svg class="chart" role="img" aria-label="기록된 가격과 보호선 추이" viewBox="0 0 '+W+' '+H+'">'+grid+entryLine+'<path d="'+line('p')+'" fill="none" stroke="#315b88" stroke-width="2.7" vector-effect="non-scaling-stroke"/><path d="'+line('s')+'" fill="none" stroke="#b8794d" stroke-width="1.8" vector-effect="non-scaling-stroke"/><text x="'+L+'" y="'+(H-9)+'">'+esc(String(arr[0].d||'').slice(5,16))+'</text><text text-anchor="end" x="'+(W-R)+'" y="'+(H-9)+'">'+esc(String(arr.at(-1).d||'').slice(5,16))+'</text></svg><div class="chart-legend"><span><i style="background:#315b88"></i>기록 가격</span><span><i style="background:#b8794d"></i>보호선</span><span><i style="background:#b5c3d2"></i>평균 진입가</span></div>';
}
function stockBack(id,isOpen,query){
  const fallback=accountPath(id,isOpen?'hold':'closed'),requested=query?.get('back'),path=safePath(requested||fallback);
  const allowed=path==='/'||path==='/performance'||/^\/account\/(ks_mid|kq_mid)(\?tab=(hold|closed|performance))?$/.test(path);
  return allowed?path:fallback;

v></section>'+footer();
}

function renderMissing(title,copy,path='/'){app.innerHTML=pageHead('기록 확인','PORTFOLIO / RECORD','')+emptyState(title,copy,path,path==='/'?'운용 현황':'계좌 목록')+footer()}
function updateNavigation(r){

function render(options={}){

function validPortfolio(d){return Boolean(d&&d.meta&&d.accounts&&d.accounts.ks_mid&&d.accounts.kq_mid)}
async function fetchJson(url,timeoutMs){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs);try{const r=await fetch(url,{cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}

async function loadData(){
  const cfg=window.TRADING_MASTER_CONFIG||{},endpoint=liveUrl(),timeout=Number(cfg.timeoutMs)||3500;clearTimeout(refreshTimer);
  if(endpoint){try{setData(await fetchJson(endpoint,timeout),'live');refreshTimer=setTimeout(loadData,Number(cfg.refreshMs)||300000);return}catch(err){console.warn('Live data unavailable; using snapshot.',err);refreshTimer=setTimeout(loadData,Number(cfg.retryMs)||60000)}}

document.addEventListener?.('click',event=>{
